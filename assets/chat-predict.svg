<svg viewBox="0 0 1477 285" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two chats. Left: the capital of France, Paris (right), and an airline injury case, Varghese v. China Southern Airlines (invented). Right: Will it rain in Rome tomorrow? I can't see the weather. What did my boss email me? I can't access your email. Paste it here and I will read it.">
  <style>
    .bg-base          { fill: #F5F7F7; }
    .bg-surface       { fill: #FFFFFF; }
    .bg-muted         { fill: #E3EBEB; }
    .text-primary     { fill: #17323A; }
    .text-secondary   { fill: #51707A; }
    .text-on-accent   { fill: #FFFFFF; }
    .accent-primary   { fill: #0E7C7B; }
    .accent-secondary { fill: #7A5195; }
    .accent-tertiary  { fill: #C2A14D; }
    .stroke-primary   { stroke: #0E7C7B; }
    .stroke-secondary { stroke: #7A5195; }
    .stroke-tertiary  { stroke: #C2A14D; }
    .stroke-strong    { stroke: #17323A; }
    .stroke-subtle    { stroke: #D3DFDF; }
  </style>
  <style>.mark-ok { fill: #2E8B57; } .mark-bad { fill: #C0392B; }</style>
  <rect class="bg-surface stroke-primary" x="349" y="2" width="354" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="367" y="35" font-family="sans-serif" font-size="20">What is the capital of France?</text>
  <rect class="accent-secondary" x="163" y="69" width="248" height="53" rx="14"/>
  <text class="text-on-accent" x="181" y="102" font-family="sans-serif" font-size="20">Paris, on the Seine.</text>
  <circle class="mark-ok" cx="441" cy="96" r="16"/>
  <path d="M434,96 L439,102 L449,90" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="bg-surface stroke-primary" x="370" y="136" width="333" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="388" y="169" font-family="sans-serif" font-size="20">Cite an airline injury case.</text>
  <rect class="accent-secondary" x="163" y="203" width="312" height="80" rx="14"/>
  <text class="text-on-accent" x="181" y="236" font-family="sans-serif" font-size="20">Varghese v. China Southern</text>
  <text class="text-on-accent" x="181" y="263" font-family="sans-serif" font-size="20">Airlines (2019).</text>
  <circle class="mark-bad" cx="505" cy="243" r="16"/>
  <path d="M499,237 L511,249 M511,237 L499,249" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <rect class="bg-surface stroke-primary" x="959" y="2" width="354" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="977" y="35" font-family="sans-serif" font-size="20">Will it rain in Rome tomorrow?</text>
  <rect class="accent-secondary" x="773" y="69" width="290" height="53" rx="14"/>
  <text class="text-on-accent" x="791" y="102" font-family="sans-serif" font-size="20">I can’t see the weather.</text>
  <circle class="text-secondary" cx="1093" cy="96" r="16"/>
  <text class="text-on-accent" x="1093" y="103" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700">?</text>
  <rect class="bg-surface stroke-primary" x="1001" y="136" width="312" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="1019" y="169" font-family="sans-serif" font-size="20">What did my boss email me?</text>
  <rect class="accent-secondary" x="773" y="203" width="386" height="80" rx="14"/>
  <text class="text-on-accent" x="791" y="236" font-family="sans-serif" font-size="20">I can’t access your email.</text>
  <text class="text-on-accent" x="791" y="263" font-family="sans-serif" font-size="20">Paste it here and I will read it.</text>
  <circle class="text-secondary" cx="1189" cy="243" r="16"/>
  <text class="text-on-accent" x="1189" y="250" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="700">?</text>
</svg>
