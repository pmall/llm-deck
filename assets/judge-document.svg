  <text x="944" y="172" text-anchor="start" font-family="sans-serif" font-size="26" font-weight="400" class="text-primary">useful</text>
  <rect x="902" y="198" width="28" height="28" rx="5" class="stroke-primary" stroke-width="3" fill="none"/>
  <text x="944" y="222" text-anchor="start" font-family="sans-serif" font-size="26" font-weight="400" class="text-primary">correct</text>
  <rect x="902" y="248" width="28" height="28" rx="5" class="stroke-primary" stroke-width="3" fill="none"/>
  <text x="944" y="272" text-anchor="start" font-family="sans-serif" font-size="26" font-weight="400" class="text-primary">fit for the task</text>
</svg>
