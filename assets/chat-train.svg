<svg viewBox="0 0 1477 264" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A chat: Is my 18:04 train to Lyon on time? Yes, it leaves on time (wrong). Next to it, a live departures board: 18:04 Lyon, Delayed 25 min.">
  <style>
    .bg-base          { fill: #F5F7F7; }
    .bg-surface       { fill: #FFFFFF; }
    .bg-muted         { fill: #E3EBEB; }
    .text-primary     { fill: #17323A; }
    .text-secondary   { fill: #51707A; }
    .text-on-accent   { fill: #FFFFFF; }
    .accent-primary   { fill: #0E7C7B; }
    .accent-secondary { fill: #7A5195; }
    .accent-tertiary  { fill: #C2A14D; }
    .stroke-primary   { stroke: #0E7C7B; }
    .stroke-secondary { stroke: #7A5195; }
    .stroke-tertiary  { stroke: #C2A14D; }
    .stroke-strong    { stroke: #17323A; }
    .stroke-subtle    { stroke: #D3DFDF; }
  </style>
  <style>.mark-ok { fill: #2E8B57; } .mark-bad { fill: #C0392B; }</style>
  <g transform="translate(0,72)">
  <rect class="bg-surface stroke-primary" x="317" y="0" width="396" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="335" y="33" font-family="sans-serif" font-size="20">Is my 18:04 train to Lyon on time?</text>
  <rect class="accent-secondary" x="173" y="67" width="280" height="53" rx="14"/>
  <text class="text-on-accent" x="191" y="100" font-family="sans-serif" font-size="20">Yes, it leaves on time.</text>
  <circle class="mark-bad" cx="483" cy="94" r="16"/>
  <path d="M477,88 L489,100 M489,88 L477,100" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(0,2)">
  <rect class="text-primary" x="773" y="0" width="540" height="260" rx="14"/>
  <text class="accent-tertiary" x="797" y="40" font-family="monospace" font-size="22" font-weight="700">DEPARTURES</text>
  <text class="text-on-accent" x="797" y="94" font-family="monospace" font-size="21">17:58</text>
  <text class="text-on-accent" x="893" y="94" font-family="monospace" font-size="21">Marseille</text>
  <text class="text-on-accent" x="1103" y="94" font-family="monospace" font-size="21">On time</text>
  <text class="text-on-accent" x="797" y="140" font-family="monospace" font-size="21" font-weight="700">18:04</text>
  <text class="text-on-accent" x="893" y="140" font-family="monospace" font-size="21" font-weight="700">Lyon</text>
  <text class="accent-tertiary" x="1103" y="140" font-family="monospace" font-size="21" font-weight="700">Delayed 25 min</text>
  <text class="text-on-accent" x="797" y="186" font-family="monospace" font-size="21">18:12</text>
  <text class="text-on-accent" x="893" y="186" font-family="monospace" font-size="21">Dijon</text>
  <text class="text-on-accent" x="1103" y="186" font-family="monospace" font-size="21">On time</text>
  <text class="text-on-accent" x="797" y="232" font-family="monospace" font-size="21">18:20</text>
  <text class="text-on-accent" x="893" y="232" font-family="monospace" font-size="21">Grenoble</text>
  <text class="text-on-accent" x="1103" y="232" font-family="monospace" font-size="21">On time</text>
  </g>
</svg>
