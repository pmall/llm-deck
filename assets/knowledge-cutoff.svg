<svg viewBox="0 0 1477 237" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline: the Paris Olympics of 2024 sit before the knowledge cutoff; the World Cup final of July 2026 sits after it. Under the Olympics: Where were the 2024 Olympics? Paris (right). Under the World Cup: Who won the 2026 World Cup? Argentina (wrong: Argentina won the 2022 final).">
  <style>
    .bg-base          { fill: #F5F7F7; }
    .bg-surface       { fill: #FFFFFF; }
    .bg-muted         { fill: #E3EBEB; }
    .text-primary     { fill: #17323A; }
    .text-secondary   { fill: #51707A; }
    .text-on-accent   { fill: #FFFFFF; }
    .accent-primary   { fill: #0E7C7B; }
    .accent-secondary { fill: #7A5195; }
    .accent-tertiary  { fill: #C2A14D; }
    .stroke-primary   { stroke: #0E7C7B; }
    .stroke-secondary { stroke: #7A5195; }
    .stroke-tertiary  { stroke: #C2A14D; }
    .stroke-strong    { stroke: #17323A; }
    .stroke-subtle    { stroke: #D3DFDF; }
  </style>
  <style>.mark-ok { fill: #2E8B57; } .mark-bad { fill: #C0392B; }</style>
  <line class="stroke-primary" x1="14" y1="102" x2="738" y2="102" stroke-width="12" stroke-linecap="round"/>
  <line class="stroke-subtle" x1="738" y1="102" x2="1437" y2="102" stroke-width="12"/>
  <polygon class="bg-muted" points="1437,84 1473,102 1437,120"/>
  <line class="stroke-strong" x1="738" y1="38" x2="738" y2="166" stroke-width="3"/>
  <text class="text-primary" x="738" y="22" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">Knowledge cutoff</text>
  <circle class="accent-primary" cx="369" cy="102" r="18"/>
  <text class="text-primary" x="369" y="62" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">Paris Olympics, 2024</text>
  <circle class="bg-surface stroke-strong" cx="1107" cy="102" r="18" stroke-width="3"/>
  <text class="text-primary" x="1107" y="110" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">?</text>
  <text class="text-primary" x="1107" y="62" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700">World Cup final, July 2026</text>
  <rect class="bg-surface stroke-primary" x="125" y="182" width="343" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="143" y="215" font-family="sans-serif" font-size="20">Where were the 2024 Olympics?</text>
  <rect class="accent-secondary" x="480" y="182" width="142" height="53" rx="14"/>
  <text class="text-on-accent" x="498" y="215" font-family="sans-serif" font-size="20">Paris.</text>
  <circle class="mark-ok" cx="652" cy="208" r="16"/>
  <path d="M645,208 L650,214 L660,202" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="bg-surface stroke-primary" x="808" y="182" width="343" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="826" y="215" font-family="sans-serif" font-size="20">Who won the 2026 World Cup?</text>
  <rect class="accent-secondary" x="1163" y="182" width="142" height="53" rx="14"/>
  <text class="text-on-accent" x="1181" y="215" font-family="sans-serif" font-size="20">Argentina.</text>
  <circle class="mark-bad" cx="1335" cy="208" r="16"/>
  <path d="M1329,202 L1341,214 M1341,202 L1329,214" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
</svg>
