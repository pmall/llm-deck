<svg viewBox="0 0 1150 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline: training data up to the cutoff, release months later, then use for a year or more; the gap between the cutoff and today keeps growing">

  <!-- THEME COPY — kujaku (styles/themes/kujaku.css). Swap to re-theme. -->
  <style>
    .bg-base          { fill: #F5F7F7; }
    .bg-surface       { fill: #FFFFFF; }
    .bg-muted         { fill: #E3EBEB; }
    .text-primary     { fill: #17323A; }
    .text-secondary   { fill: #51707A; }
    .text-on-accent   { fill: #FFFFFF; }
    .accent-primary   { fill: #0E7C7B; }
    .accent-secondary { fill: #7A5195; }
    .accent-tertiary  { fill: #C2A14D; }
    .stroke-primary   { stroke: #0E7C7B; }
    .stroke-secondary { stroke: #7A5195; }
    .stroke-tertiary  { stroke: #C2A14D; }
    .stroke-strong    { stroke: #17323A; }
    .stroke-subtle    { stroke: #D3DFDF; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="accent-secondary"/>
    </marker>
  </defs>
  <!-- time axis -->
  <line x1="20" y1="150" x2="1120" y2="150" class="stroke-strong" stroke-width="2" fill="none"/>
  <polygon points="1130,150 1116,143 1116,157" class="text-primary"/>
  <text x="1130" y="180" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="400" class="text-secondary">time</text>

  <!-- what the model knows -->
  <rect x="20" y="94" width="520" height="50" rx="6" class="accent-primary"/>
  <text x="280" y="126" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" class="text-on-accent">Training data: what the LLM knows</text>

  <!-- what it cannot know -->
  <rect x="540" y="94" width="500" height="50" rx="6" class="bg-muted"/>
  <text x="790" y="126" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" class="text-primary">Nothing after the cutoff</text>

  <!-- markers -->
  <line x1="540" y1="80" x2="540" y2="164" class="stroke-strong" stroke-width="3" fill="none"/>
  <text x="540" y="190" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" class="text-primary">cutoff</text>
  <line x1="700" y1="144" x2="700" y2="164" class="stroke-strong" stroke-width="3" fill="none"/>
  <text x="700" y="190" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" class="text-primary">release</text>
  <text x="700" y="212" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="400" class="text-secondary">months later</text>
  <line x1="1040" y1="80" x2="1040" y2="164" class="stroke-secondary" stroke-width="3" fill="none"/>
  <text x="1040" y="190" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" class="accent-secondary">today</text>
  <text x="1040" y="212" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="400" class="text-secondary">a year or more in use</text>
  <line x1="1046" y1="66" x2="1100" y2="66" class="stroke-secondary" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <text x="1040" y="72" text-anchor="end" font-family="sans-serif" font-size="14" font-weight="400" class="accent-secondary">keeps moving</text>

  <!-- the gap -->
  <path d="M 545 236 L 545 246 L 1035 246 L 1035 236" class="stroke-secondary" stroke-width="2" fill="none"/>
  <text x="790" y="272" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" class="accent-secondary">the gap grows every day</text>
</svg>
