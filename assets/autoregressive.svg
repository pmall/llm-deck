<svg viewBox="0 -36 934 396" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Autoregressive generation: llm(The cat) gives sat; sat drops into the next input, llm(The cat sat) gives on; then the; then mat. Each output token sits right above the place where it is added to the next input.">

