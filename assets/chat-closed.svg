<svg viewBox="0 0 1477 289" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A chat in a closed frame: Will it rain in Rome tomorrow? I can't see the weather. Then email my team about it. I can't send emails. Here's a draft. Outside the frame, cut links: the weather service and your mailbox on the left, pointing in; send an email and save a file on the right, pointing out.">
  <style>
    .bg-base          { fill: #F5F7F7; }
    .bg-surface       { fill: #FFFFFF; }
    .bg-muted         { fill: #E3EBEB; }
    .text-primary     { fill: #17323A; }
    .text-secondary   { fill: #51707A; }
    .text-on-accent   { fill: #FFFFFF; }
    .accent-primary   { fill: #0E7C7B; }
    .accent-secondary { fill: #7A5195; }
    .accent-tertiary  { fill: #C2A14D; }
    .stroke-primary   { stroke: #0E7C7B; }
    .stroke-secondary { stroke: #7A5195; }
    .stroke-tertiary  { stroke: #C2A14D; }
    .stroke-strong    { stroke: #17323A; }
    .stroke-subtle    { stroke: #D3DFDF; }
  </style>
  <rect class="bg-surface stroke-strong" x="493" y="2" width="490" height="285" rx="16" stroke-width="2.5"/>
  <rect class="bg-surface stroke-primary" x="609" y="18" width="354" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="627" y="51" font-family="sans-serif" font-size="20">Will it rain in Rome tomorrow?</text>
  <rect class="accent-secondary" x="513" y="85" width="290" height="53" rx="14"/>
  <text class="text-on-accent" x="531" y="118" font-family="sans-serif" font-size="20">I can’t see the weather.</text>
  <rect class="bg-surface stroke-primary" x="630" y="152" width="333" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="648" y="185" font-family="sans-serif" font-size="20">Then email my team about it.</text>
  <rect class="accent-secondary" x="513" y="219" width="418" height="53" rx="14"/>
  <text class="text-on-accent" x="531" y="252" font-family="sans-serif" font-size="20">I can’t send emails. Here’s a draft.</text>
  <rect class="bg-muted" x="163" y="48" width="230" height="64" rx="12"/>
  <text class="text-primary" x="278" y="87" text-anchor="middle" font-family="sans-serif" font-size="21">Weather service</text>
  <line class="stroke-subtle" x1="399" y1="80" x2="434.0" y2="80" stroke-width="3"/>
  <line class="stroke-subtle" x1="452.0" y1="80" x2="475" y2="80" stroke-width="3"/>
  <line class="stroke-strong" x1="434.0" y1="69" x2="434.0" y2="91" stroke-width="3"/>
  <line class="stroke-strong" x1="452.0" y1="69" x2="452.0" y2="91" stroke-width="3"/>
  <polygon class="bg-muted" points="487,80 473,71 473,89"/>
  <rect class="bg-muted" x="1084" y="48" width="230" height="64" rx="12"/>
  <text class="text-primary" x="1199" y="87" text-anchor="middle" font-family="sans-serif" font-size="21">Send an email</text>
  <line class="stroke-subtle" x1="989" y1="80" x2="1024.5" y2="80" stroke-width="3"/>
  <line class="stroke-subtle" x1="1042.5" y1="80" x2="1066" y2="80" stroke-width="3"/>
  <line class="stroke-strong" x1="1024.5" y1="69" x2="1024.5" y2="91" stroke-width="3"/>
  <line class="stroke-strong" x1="1042.5" y1="69" x2="1042.5" y2="91" stroke-width="3"/>
  <polygon class="bg-muted" points="1078,80 1064,71 1064,89"/>
  <rect class="bg-muted" x="163" y="178" width="230" height="64" rx="12"/>
  <text class="text-primary" x="278" y="217" text-anchor="middle" font-family="sans-serif" font-size="21">Your mailbox</text>
  <line class="stroke-subtle" x1="399" y1="210" x2="434.0" y2="210" stroke-width="3"/>
  <line class="stroke-subtle" x1="452.0" y1="210" x2="475" y2="210" stroke-width="3"/>
  <line class="stroke-strong" x1="434.0" y1="199" x2="434.0" y2="221" stroke-width="3"/>
  <line class="stroke-strong" x1="452.0" y1="199" x2="452.0" y2="221" stroke-width="3"/>
  <polygon class="bg-muted" points="487,210 473,201 473,219"/>
  <rect class="bg-muted" x="1084" y="178" width="230" height="64" rx="12"/>
  <text class="text-primary" x="1199" y="217" text-anchor="middle" font-family="sans-serif" font-size="21">Save a file</text>
  <line class="stroke-subtle" x1="989" y1="210" x2="1024.5" y2="210" stroke-width="3"/>
  <line class="stroke-subtle" x1="1042.5" y1="210" x2="1066" y2="210" stroke-width="3"/>
  <line class="stroke-strong" x1="1024.5" y1="199" x2="1024.5" y2="221" stroke-width="3"/>
  <line class="stroke-strong" x1="1042.5" y1="199" x2="1042.5" y2="221" stroke-width="3"/>
  <polygon class="bg-muted" points="1078,210 1064,201 1064,219"/>
</svg>
