  <text class="text-primary" x="606" y="185" font-family="sans-serif" font-size="20">Then email my team I’ll be late.</text>
  <rect class="accent-secondary" x="513" y="219" width="418" height="53" rx="14"/>
  <text class="text-on-accent" x="531" y="252" font-family="sans-serif" font-size="20">I can’t send emails. Here’s a draft.</text>
