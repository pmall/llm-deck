<svg viewBox="0 0 1477 289" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A chat in a closed frame: Is my 18:04 train on time? I can't see live train times. Then email my team I'll be late. I can't send emails. Here's a draft. Outside the frame, cut links: the weather service and your mailbox on the left (web search, orders database, live train times), pointing in; send an email and save a file on the right, pointing out.">
  <style>
    .bg-base          { fill: #F5F7F7; }
    .bg-surface       { fill: #FFFFFF; }
    .bg-muted         { fill: #E3EBEB; }
    .text-primary     { fill: #17323A; }
    .text-secondary   { fill: #51707A; }
    .text-on-accent   { fill: #FFFFFF; }
    .accent-primary   { fill: #0E7C7B; }
    .accent-secondary { fill: #7A5195; }
    .accent-tertiary  { fill: #C2A14D; }
    .stroke-primary   { stroke: #0E7C7B; }
    .stroke-secondary { stroke: #7A5195; }
    .stroke-tertiary  { stroke: #C2A14D; }
    .stroke-strong    { stroke: #17323A; }
    .stroke-subtle    { stroke: #D3DFDF; }
  </style>
  <rect class="bg-surface stroke-strong" x="493" y="2" width="490" height="285" rx="16" stroke-width="2.5"/>
  <rect class="bg-surface stroke-primary" x="651" y="18" width="312" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="669" y="51" font-family="sans-serif" font-size="20">Is my 18:04 train on time?</text>
  <rect class="accent-secondary" x="513" y="85" width="343" height="53" rx="14"/>
  <text class="text-on-accent" x="531" y="118" font-family="sans-serif" font-size="20">I can’t see live train times.</text>
