<svg viewBox="10 140 1018 238" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Guessing the next word: “She took her umbrella because it started to …” rain; “The baby was tired, so she fell …” asleep; “He grew up in Paris, so he speaks …” French">

