<svg viewBox="0 -4 1668 324" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A chat as one LLM call per assistant turn: llm(user: What is the capital of France?) gives assistant: Paris.; that turn and the new user turn And of Italy? go back in and give Rome.; then And of Spain? is added and gives Madrid. Each assistant turn sits right above the place where it is added to the next input.">

  <!-- THEME COPY — kujaku (styles/themes/kujaku.css). Swap to re-theme. -->
  <style>
    .bg-base          { fill: #F5F7F7; }
    .bg-surface       { fill: #FFFFFF; }
    .bg-muted         { fill: #E3EBEB; }
    .text-primary     { fill: #17323A; }
    .text-secondary   { fill: #51707A; }
    .text-on-accent   { fill: #FFFFFF; }
    .accent-primary   { fill: #0E7C7B; }
    .accent-secondary { fill: #7A5195; }
    .accent-tertiary  { fill: #C2A14D; }
    .stroke-primary   { stroke: #0E7C7B; }
    .stroke-secondary { stroke: #7A5195; }
    .stroke-tertiary  { stroke: #C2A14D; }
    .stroke-strong    { stroke: #17323A; }
    .stroke-subtle    { stroke: #D3DFDF; }
  </style>

  <!-- each assistant turn (purple) sits above the slot it fills in the next call (outlined purple); the new user turn is outlined teal -->
  <text x="0" y="50" font-family="monospace" font-size="32" font-weight="700" class="text-primary">llm(</text>
  <rect x="92" y="0" width="502" height="76" rx="6" class="bg-muted"/>
  <text x="108" y="26" font-family="monospace" font-size="18" class="text-secondary">user</text>
  <text x="108" y="59" font-family="monospace" font-size="26" class="text-primary">What is the capital of France?</text>
  <text x="604" y="50" font-family="monospace" font-size="32" font-weight="700" class="text-primary">)</text>
  <rect x="634" y="0" width="130" height="76" rx="6" class="accent-secondary"/>
  <text x="650" y="26" font-family="monospace" font-size="18" class="text-on-accent">assistant</text>
  <text x="650" y="59" font-family="monospace" font-size="26" class="text-on-accent">Paris.</text>
  <path d="M 699.0 82 L 699.0 106" class="stroke-secondary" stroke-width="3" fill="none"/>
  <path d="M 691.0 98 L 699.0 108 L 707.0 98" class="stroke-secondary" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="0" y="170" font-family="monospace" font-size="32" font-weight="700" class="text-primary">llm(</text>
  <rect x="92" y="120" width="502" height="76" rx="6" class="bg-muted"/>
  <text x="108" y="146" font-family="monospace" font-size="18" class="text-secondary">user</text>
  <text x="108" y="179" font-family="monospace" font-size="26" class="text-primary">What is the capital of France?</text>
  <rect x="634" y="120" width="130" height="76" rx="6" class="bg-muted stroke-secondary" stroke-width="3"/>
  <text x="650" y="146" font-family="monospace" font-size="18" class="text-secondary">assistant</text>
  <text x="650" y="179" font-family="monospace" font-size="26" class="text-primary">Paris.</text>
  <rect x="804" y="120" width="235" height="76" rx="6" class="bg-muted stroke-primary" stroke-width="3"/>
  <text x="820" y="146" font-family="monospace" font-size="18" class="text-secondary">user</text>
  <text x="820" y="179" font-family="monospace" font-size="26" class="text-primary">And of Italy?</text>
  <text x="1049" y="170" font-family="monospace" font-size="32" font-weight="700" class="text-primary">)</text>
  <rect x="1079" y="120" width="130" height="76" rx="6" class="accent-secondary"/>
  <text x="1095" y="146" font-family="monospace" font-size="18" class="text-on-accent">assistant</text>
  <text x="1095" y="179" font-family="monospace" font-size="26" class="text-on-accent">Rome.</text>
  <path d="M 1144.0 202 L 1144.0 226" class="stroke-secondary" stroke-width="3" fill="none"/>
  <path d="M 1136.0 218 L 1144.0 228 L 1152.0 218" class="stroke-secondary" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="0" y="290" font-family="monospace" font-size="32" font-weight="700" class="text-primary">llm(</text>
  <rect x="92" y="240" width="502" height="76" rx="6" class="bg-muted"/>
  <text x="108" y="266" font-family="monospace" font-size="18" class="text-secondary">user</text>
  <text x="108" y="299" font-family="monospace" font-size="26" class="text-primary">What is the capital of France?</text>
  <rect x="634" y="240" width="130" height="76" rx="6" class="bg-muted"/>
  <text x="650" y="266" font-family="monospace" font-size="18" class="text-secondary">assistant</text>
  <text x="650" y="299" font-family="monospace" font-size="26" class="text-primary">Paris.</text>
  <rect x="804" y="240" width="235" height="76" rx="6" class="bg-muted"/>
  <text x="820" y="266" font-family="monospace" font-size="18" class="text-secondary">user</text>
  <text x="820" y="299" font-family="monospace" font-size="26" class="text-primary">And of Italy?</text>
  <rect x="1079" y="240" width="130" height="76" rx="6" class="bg-muted stroke-secondary" stroke-width="3"/>
  <text x="1095" y="266" font-family="monospace" font-size="18" class="text-secondary">assistant</text>
  <text x="1095" y="299" font-family="monospace" font-size="26" class="text-primary">Rome.</text>
  <rect x="1249" y="240" width="235" height="76" rx="6" class="bg-muted stroke-primary" stroke-width="3"/>
  <text x="1265" y="266" font-family="monospace" font-size="18" class="text-secondary">user</text>
  <text x="1265" y="299" font-family="monospace" font-size="26" class="text-primary">And of Spain?</text>
  <text x="1494" y="290" font-family="monospace" font-size="32" font-weight="700" class="text-primary">)</text>
  <rect x="1524" y="240" width="142" height="76" rx="6" class="accent-secondary"/>
  <text x="1540" y="266" font-family="monospace" font-size="18" class="text-on-accent">assistant</text>
  <text x="1540" y="299" font-family="monospace" font-size="26" class="text-on-accent">Madrid.</text>
</svg>
