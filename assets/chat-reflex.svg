<svg viewBox="0 0 1477 285" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two chats. Left: What is the capital of France? Paris, on the Seine (right). Are you sure? Yes, it has been the capital for centuries (right). Right: Cite an airline injury case. Varghese v. China Southern Airlines, 2019 (invented). Is it a real case? Yes, it is on Westlaw (invented).">
  <style>
    .bg-base          { fill: #F5F7F7; }
    .bg-surface       { fill: #FFFFFF; }
    .bg-muted         { fill: #E3EBEB; }
    .text-primary     { fill: #17323A; }
    .text-secondary   { fill: #51707A; }
    .text-on-accent   { fill: #FFFFFF; }
    .accent-primary   { fill: #0E7C7B; }
    .accent-secondary { fill: #7A5195; }
    .accent-tertiary  { fill: #C2A14D; }
    .stroke-primary   { stroke: #0E7C7B; }
    .stroke-secondary { stroke: #7A5195; }
    .stroke-tertiary  { stroke: #C2A14D; }
    .stroke-strong    { stroke: #17323A; }
    .stroke-subtle    { stroke: #D3DFDF; }
  </style>
  <style>.mark-ok { fill: #2E8B57; } .mark-bad { fill: #C0392B; }</style>
  <rect class="bg-surface stroke-primary" x="349" y="2" width="354" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="367" y="35" font-family="sans-serif" font-size="20">What is the capital of France?</text>
  <rect class="accent-secondary" x="163" y="69" width="248" height="53" rx="14"/>
  <text class="text-on-accent" x="181" y="102" font-family="sans-serif" font-size="20">Paris, on the Seine.</text>
  <circle class="mark-ok" cx="441" cy="96" r="16"/>
  <path d="M434,96 L439,102 L449,90" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="bg-surface stroke-primary" x="529" y="136" width="174" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="547" y="169" font-family="sans-serif" font-size="20">Are you sure?</text>
  <rect class="accent-secondary" x="163" y="203" width="333" height="80" rx="14"/>
  <text class="text-on-accent" x="181" y="236" font-family="sans-serif" font-size="20">Yes. It has been the capital</text>
  <text class="text-on-accent" x="181" y="263" font-family="sans-serif" font-size="20">for centuries.</text>
  <circle class="mark-ok" cx="526" cy="243" r="16"/>
  <path d="M519,243 L524,249 L534,237" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="bg-surface stroke-primary" x="980" y="2" width="333" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="998" y="35" font-family="sans-serif" font-size="20">Cite an airline injury case.</text>
  <rect class="accent-secondary" x="773" y="69" width="312" height="80" rx="14"/>
  <text class="text-on-accent" x="791" y="102" font-family="sans-serif" font-size="20">Varghese v. China Southern</text>
  <text class="text-on-accent" x="791" y="129" font-family="sans-serif" font-size="20">Airlines (2019).</text>
  <circle class="mark-bad" cx="1115" cy="109" r="16"/>
  <path d="M1109,103 L1121,115 M1121,103 L1109,115" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <rect class="bg-surface stroke-primary" x="1086" y="163" width="227" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="1104" y="196" font-family="sans-serif" font-size="20">Is it a real case?</text>
  <rect class="accent-secondary" x="773" y="230" width="269" height="53" rx="14"/>
  <text class="text-on-accent" x="791" y="263" font-family="sans-serif" font-size="20">Yes. It is on Westlaw.</text>
  <circle class="mark-bad" cx="1072" cy="256" r="16"/>
  <path d="M1066,250 L1078,262 M1078,250 L1066,262" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
</svg>
