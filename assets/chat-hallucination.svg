<svg viewBox="0 0 1477 285" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A chat: Cite an airline injury case. Varghese v. China Southern Airlines, 2019 (invented). Is it a real case? Yes. It is on Westlaw (invented).">
  <style>
    .bg-base          { fill: #F5F7F7; }
    .bg-surface       { fill: #FFFFFF; }
    .bg-muted         { fill: #E3EBEB; }
    .text-primary     { fill: #17323A; }
    .text-secondary   { fill: #51707A; }
    .text-on-accent   { fill: #FFFFFF; }
    .accent-primary   { fill: #0E7C7B; }
    .accent-secondary { fill: #7A5195; }
    .accent-tertiary  { fill: #C2A14D; }
    .stroke-primary   { stroke: #0E7C7B; }
    .stroke-secondary { stroke: #7A5195; }
    .stroke-tertiary  { stroke: #C2A14D; }
    .stroke-strong    { stroke: #17323A; }
    .stroke-subtle    { stroke: #D3DFDF; }
  </style>
  <style>.mark-ok { fill: #2E8B57; } .mark-bad { fill: #C0392B; }</style>
  <rect class="bg-surface stroke-primary" x="685" y="2" width="333" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="703" y="35" font-family="sans-serif" font-size="20">Cite an airline injury case.</text>
  <rect class="accent-secondary" x="458" y="69" width="312" height="80" rx="14"/>
  <text class="text-on-accent" x="476" y="102" font-family="sans-serif" font-size="20">Varghese v. China Southern</text>
  <text class="text-on-accent" x="476" y="129" font-family="sans-serif" font-size="20">Airlines (2019).</text>
  <circle class="mark-bad" cx="800" cy="109" r="16"/>
  <path d="M794,103 L806,115 M806,103 L794,115" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  <rect class="bg-surface stroke-primary" x="791" y="163" width="227" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="809" y="196" font-family="sans-serif" font-size="20">Is it a real case?</text>
  <rect class="accent-secondary" x="458" y="230" width="269" height="53" rx="14"/>
  <text class="text-on-accent" x="476" y="263" font-family="sans-serif" font-size="20">Yes. It is on Westlaw.</text>
  <circle class="mark-bad" cx="757" cy="256" r="16"/>
  <path d="M751,250 L763,262 M763,250 L751,262" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
</svg>
