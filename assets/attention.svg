<svg viewBox="-190 0 1280 299" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Predicting the next word: in “The farmer caught the mouse in a …” the empty slot blends in the meaning of caught and mouse, then predicts trap; in “The gamer clicked the left mouse …” it blends in clicked and mouse, then predicts button">

