  <text x="701" y="105" text-anchor="middle" font-family="monospace" font-size="24" font-weight="400" class="text-on-accent">trap</text>
  <text x="782" y="105" text-anchor="start" font-family="sans-serif" font-size="22" font-weight="700" class="text-primary">→ the animal</text>
