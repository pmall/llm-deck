  <text x="28.5" y="286" text-anchor="middle" font-family="monospace" font-size="24" font-weight="400" class="text-primary">The</text>
  <rect x="76.5" y="255" width="102" height="46" rx="6" class="bg-muted"/>
  <text x="127.5" y="286" text-anchor="middle" font-family="monospace" font-size="24" font-weight="400" class="text-primary">gamer</text>
  <rect x="189.5" y="255" width="132" height="46" rx="6" class="accent-primary"/>
  <text x="255.5" y="286" text-anchor="middle" font-family="monospace" font-size="24" font-weight="400" class="text-on-accent">clicked</text>
  <rect x="332.5" y="255" width="74" height="46" rx="6" class="bg-muted"/>
  <text x="369.5" y="286" text-anchor="middle" font-family="monospace" font-size="24" font-weight="400" class="text-primary">the</text>
  <rect x="417.5" y="255" width="88" height="46" rx="6" class="bg-muted"/>
  <text x="461.5" y="286" text-anchor="middle" font-family="monospace" font-size="24" font-weight="400" class="text-primary">left</text>
  <rect x="516.5" y="255" width="102" height="46" rx="6" class="accent-secondary"/>
  <text x="567.5" y="286" text-anchor="middle" font-family="monospace" font-size="24" font-weight="400" class="text-on-accent">mouse</text>
  <rect x="629.5" y="255" width="117" height="46" rx="6" class="accent-primary"/>
