  <path d="M 470 70 Q 367.25 8.35 264.5 70" class="stroke-primary" stroke-width="7.5" stroke-linecap="round" fill="none"/>
  <path d="M 470 70 Q 585.5 0.7 701 70" class="stroke-primary" stroke-width="7.5" stroke-linecap="round" fill="none"/>
  <rect x="-7" y="74" width="74" height="46" rx="6" class="bg-muted"/>
  <text x="30" y="105" text-anchor="middle" font-family="monospace" font-size="24" font-weight="400" class="text-primary">The</text>
  <rect x="78" y="74" width="117" height="46" rx="6" class="bg-muted"/>
  <text x="136.5" y="105" text-anchor="middle" font-family="monospace" font-size="24" font-weight="400" class="text-primary">farmer</text>
  <rect x="206" y="74" width="117" height="46" rx="6" class="accent-primary"/>
  <text x="264.5" y="105" text-anchor="middle" font-family="monospace" font-size="24" font-weight="400" class="text-on-accent">caught</text>
  <rect x="334" y="74" width="74" height="46" rx="6" class="bg-muted"/>
  <text x="371" y="105" text-anchor="middle" font-family="monospace" font-size="24" font-weight="400" class="text-primary">the</text>
  <rect x="419" y="74" width="102" height="46" rx="6" class="accent-secondary"/>
  <text x="470" y="105" text-anchor="middle" font-family="monospace" font-size="24" font-weight="400" class="text-on-accent">mouse</text>
