<svg viewBox="10 40 1018 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Guessing the next word: in “She took her umbrella because it started to …” the blank (rain) draws mostly on umbrella, less on started; in “The milk stayed out all night, so it smelled …” the blank (sour) draws mostly on milk, night and smelled">

  <!-- THEME COPY — kujaku (styles/themes/kujaku.css). Swap to re-theme. -->
  <style>
    .bg-base          { fill: #F5F7F7; }
