<svg viewBox="-190 0 1280 303" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Attention from mouse: in “The farmer caught the mouse in a trap” caught and trap pull it toward the animal; in “The gamer clicked the left mouse button” clicked and button pull it toward the device">

  <!-- THEME COPY — kujaku (styles/themes/kujaku.css). Swap to re-theme. -->
  <style>
    .bg-base          { fill: #F5F7F7; }
    .bg-surface       { fill: #FFFFFF; }
    .bg-muted         { fill: #E3EBEB; }
    .text-primary     { fill: #17323A; }
    .text-secondary   { fill: #51707A; }
    .text-on-accent   { fill: #FFFFFF; }
    .accent-primary   { fill: #0E7C7B; }
    .accent-secondary { fill: #7A5195; }
    .accent-tertiary  { fill: #C2A14D; }
    .stroke-primary   { stroke: #0E7C7B; }
    .stroke-secondary { stroke: #7A5195; }
    .stroke-tertiary  { stroke: #C2A14D; }
    .stroke-strong    { stroke: #17323A; }
    .stroke-subtle    { stroke: #D3DFDF; }
  </style>
  <!-- attention in general: arcs from mouse to every other word, both ways; thick teal = the words that count -->
  <path d="M 470 70 Q 250 -62 30 70" class="stroke-secondary" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 470 70 Q 303.25 -30.05 136.5 70" class="stroke-secondary" stroke-width="2.2" stroke-linecap="round" fill="none"/>
