<svg viewBox="0 0 560 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Context window: a frame holding a conversation (What is the capital of France? Paris. What should I visit there first? The Louvre. Book ahead to see the Mona Lisa.), then room left">
  <style>
    .bg-base          { fill: #F5F7F7; }
    .bg-surface       { fill: #FFFFFF; }
    .bg-muted         { fill: #E3EBEB; }
    .text-primary     { fill: #17323A; }
    .text-secondary   { fill: #51707A; }
    .text-on-accent   { fill: #FFFFFF; }
    .accent-primary   { fill: #0E7C7B; }
    .accent-secondary { fill: #7A5195; }
    .accent-tertiary  { fill: #C2A14D; }
    .stroke-primary   { stroke: #0E7C7B; }
    .stroke-secondary { stroke: #7A5195; }
    .stroke-tertiary  { stroke: #C2A14D; }
    .stroke-strong    { stroke: #17323A; }
    .stroke-subtle    { stroke: #D3DFDF; }
  </style>
  <text class="text-primary" x="280" y="24" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700">Context window</text>
  <rect class="bg-surface stroke-strong" x="2" y="40" width="556" height="428" rx="16" stroke-width="2.5"/>
  <rect class="bg-surface stroke-primary" x="184" y="60" width="354" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="202" y="93" font-family="sans-serif" font-size="20">What is the capital of France?</text>
  <rect class="accent-secondary" x="22" y="127" width="100" height="53" rx="14"/>
  <text class="text-on-accent" x="40" y="160" font-family="sans-serif" font-size="20">Paris.</text>
  <rect class="bg-surface stroke-primary" x="163" y="194" width="375" height="53" rx="14" stroke-width="2"/>
  <text class="text-primary" x="181" y="227" font-family="sans-serif" font-size="20">What should I visit there first?</text>
  <rect class="accent-secondary" x="22" y="261" width="269" height="80" rx="14"/>
  <text class="text-on-accent" x="40" y="294" font-family="sans-serif" font-size="20">The Louvre. Book ahead</text>
  <text class="text-on-accent" x="40" y="321" font-family="sans-serif" font-size="20">to see the Mona Lisa.</text>
  <rect class="stroke-subtle" x="22" y="359" width="516" height="91" rx="12" fill="none" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="text-secondary" x="280" y="412" text-anchor="middle" font-family="sans-serif" font-size="20">Room left</text>
</svg>
